allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  core-js: false
  # Optional drizzle-orm peer; not installed. Keep its native build blocked.
  better-sqlite3: false
  '@swc/core': true

# Security patches are newer than the default minimum release age, so they have
# to be allowed through explicitly. Added by `pnpm audit --fix=override`.
minimumReleaseAgeExclude:
  - brace-expansion@1.1.16
  - brace-expansion@5.0.7
  - js-yaml@4.3.0
  - svgo@3.3.4
  - dompurify@3.4.12
  - sharp@0.35.0
  - brace-expansion@1.1.17
  - brace-expansion@5.0.8
  # 2026-08-21 round.
  - brace-expansion@1.1.18
  - brace-expansion@5.0.9
  - dompurify@3.4.13
  - nanoid@3.3.18
  - nanoid@5.1.16
  - undici@7.29.0

# Force patched versions of transitive deps flagged by `pnpm audit`. Every entry
# here is TRANSITIVE — none of these are direct dependencies, so an override is
# the only way to move them without waiting on the parent package to release.
#
# esbuild: used only by drizzle-kit/tsx/vitest — NOT by `next build`.
# postcss: pulled in transitively by Next at 8.4.31 (vuln); 8.5.x is compatible.
# dompurify: pulled in by jspdf/jspdf-autotable (PDF export). Ships to the
#   browser, so its XSS advisories are the ones that actually matter here.
# nanoid: two independent lines — 3.x under postcss (Next/Tailwind) and 5.x
#   under docx (Word export). The ranges below are disjoint so each line moves
#   to the patch for its own major.
# undici: only reachable via jsdom → vitest, i.e. the test runner. Kept on 7.x
#   because that is the major jsdom expects.
# brace-expansion: 1.1.18 / 5.0.9 are the fixes for CVE-2026-69152, which
#   bypassed the earlier CVE-2026-14257 mitigation. Note GitHub's dashboard
#   reports "upgrade to 5.0.8" for a 1.1.18 install — that is the highest
#   patched release across all lines, not a requirement to jump major; 1.1.18
#   already carries the 1.x fix.
#
# Each entry pins the LOWEST safe release rather than the newest, so the blast
# radius stays small.
overrides:
  esbuild: "^0.28.1"
  postcss: "^8.5.15"
  dompurify: "^3.4.13"
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  brace-expansion@>=3.0.0 <3.0.6: ^3.0.6
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  js-yaml@>=4.0.0 <4.3.0: ^4.3.0
  nanoid@<3.3.18: ^3.3.18
  nanoid@>=4.0.0 <5.1.16: ^5.1.16
  sharp@<0.35.0: ^0.35.0
  svgo@>=3.0.0 <3.3.4: ^3.3.4
  undici@>=7.0.0 <7.29.0: ^7.29.0
