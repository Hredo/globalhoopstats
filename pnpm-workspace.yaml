allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  core-js: false
  # Optional drizzle-orm peer; not installed. Keep its native build blocked.
  better-sqlite3: false
  '@swc/core': true

# Security patches are newer than the default minimum release age, so they have
# to be allowed through explicitly. Added by `pnpm audit --fix=override`.
minimumReleaseAgeExclude:
  - brace-expansion@1.1.16
  - brace-expansion@5.0.7
  - js-yaml@4.3.0
  - svgo@3.3.4
  - dompurify@3.4.12
  - sharp@0.35.0
  - brace-expansion@1.1.17
  - brace-expansion@5.0.8

# Force patched versions of transitive deps flagged by `pnpm audit`.
# esbuild: used only by drizzle-kit/tsx/vitest — NOT by `next build`.
# postcss: pulled in transitively by Next at 8.4.31 (vuln); 8.5.x is compatible.
# dompurify: pulled in transitively by jspdf; <=3.4.11 is vulnerable
#   (GHSA-cmwh-pvxp-8882 then GHSA-vhxf-7vqr-mrjg), 3.4.12 patches both.
#
# The version-ranged entries below were generated by `pnpm audit --fix=override`
# on 2026-08-02, clearing all 17 advisories. Each pins the lowest safe release
# rather than the newest, so the blast radius stays small:
# brace-expansion (DoS via unbounded expansion), js-yaml + svgo (build tooling
# only), sharp (used by Next for image optimisation — 0.35 is a minor bump and
# the production build was re-run to confirm it still compiles).
overrides:
  esbuild: "^0.28.1"
  postcss: "^8.5.15"
  dompurify: "^3.4.11"
  brace-expansion@<1.1.16: ^1.1.16
  brace-expansion@<1.1.17: ^1.1.17
  brace-expansion@>=3.0.0 <5.0.7: ^5.0.7
  brace-expansion@>=4.0.0 <5.0.8: ^5.0.8
  dompurify@<=3.4.11: ^3.4.12
  js-yaml@>=4.0.0 <4.3.0: ^4.3.0
  sharp@<0.35.0: ^0.35.0
  svgo@>=3.0.0 <3.3.4: ^3.3.4
