<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sin conexión · GlobalHoopStats</title>
<link rel="icon" href="/icon-192">
<style>
  /* Served by the service worker when a navigation fails, so it can't rely on
     the app's CSS or fonts. Colours mirror the site's paper/ink palette. */
  :root {
    color-scheme: light dark;
    --bg: #f7f4ee;
    --ink: #2a2622;
    --muted: #7c756d;
    --line: #d8d1c6;
    --accent: #df6b13;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141210;
      --ink: #eee9e1;
      --muted: #9a9289;
      --line: #3a352f;
      --accent: #f08a33;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141210;
    --ink: #eee9e1;
    --muted: #9a9289;
    --line: #3a352f;
    --accent: #f08a33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 720px; }
  .eyebrow {
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
  }
  h1 {
    font-family: "Fraunces", "Times New Roman", serif;
    font-weight: 600;
    font-size: clamp(32px, 7vw, 52px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 12px 0 0;
  }
  p.lede { color: var(--muted); font-size: 16px; line-height: 1.55; margin: 14px 0 0; max-width: 52ch; }
  canvas {
    display: block;
    width: 100%;
    height: 220px;
    margin-top: 28px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    --hoop-muted: var(--muted);
    --hoop-accent: var(--accent);
    --hoop-line: var(--line);
    touch-action: manipulation;
    cursor: pointer;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 20px; }
  button {
    font: inherit;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 6px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible, canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .hint { font-family: "Space Mono", ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .back-online { display: none; color: var(--accent); font-weight: 600; font-size: 14px; }
  [data-online="true"] .back-online { display: inline; }
</style>
</head>
<body data-offline-page>
<main>
  <p class="eyebrow" data-es="Sin conexión · GlobalHoopStats" data-en="Offline · GlobalHoopStats">Sin conexión · GlobalHoopStats</p>
  <h1 data-es="Tiempo muerto." data-en="Time-out.">Tiempo muerto.</h1>
  <p class="lede" data-es="No hay conexión a internet. Mientras vuelve, sal al contraataque: salta a los defensores y machaca cuando pase un aro." data-en="There's no internet connection. While it comes back, run the fast break: jump the defenders and dunk when a hoop comes by.">No hay conexión a internet. Mientras vuelve, sal al contraataque: salta a los defensores y machaca cuando pase un aro.</p>
  <canvas data-hoop-game="auto"></canvas>
  <div class="row">
    <button type="button" data-offline-retry data-es="Reintentar" data-en="Try again">Reintentar</button>
    <span class="hint" data-es="Espacio / ↑ / toque para saltar · mantén para llegar al aro" data-en="Space / ↑ / tap to jump · hold to reach the rim">Espacio / ↑ / toque para saltar · mantén para llegar al aro</span>
    <span class="back-online" data-es="Conexión recuperada. Pulsa Reintentar." data-en="You're back online. Hit Try again.">Conexión recuperada. Pulsa Reintentar.</span>
  </div>
</main>
<script src="/hoop-game.js"></script>
</body>
</html>
